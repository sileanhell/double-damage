name: Build

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: x86_64-pc-windows-msvc
  RUSTFLAGS: -C target-feature=+crt-static

jobs:
  # dd-core: providers, sign-ins, local models and the Anthropic/OpenAI-compatible API, as a
  # standalone CLI. Needs neither bun nor the web front end.
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - name: Test
        run: cargo test -p dd-core --target ${{ env.TARGET }}
      - name: Build
        run: cargo build -p dd-core --release --target ${{ env.TARGET }}
      - uses: actions/upload-artifact@v7
        with:
          name: dd-core
          path: target/${{ env.TARGET }}/release/dd-core.exe
          if-no-files-found: error

  # The desktop app: a window over dd-core's API. Built on its own, in parallel with the core.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bunx tauri build --target ${{ env.TARGET }}
      - uses: actions/upload-artifact@v7
        with:
          name: dd-desktop
          path: target/${{ env.TARGET }}/release/dd.exe
          if-no-files-found: error

  # The app starts dd-core.exe from its own folder: ship the two side by side.
  bundle:
    runs-on: ubuntu-latest
    needs: [core, desktop]
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dd-*
          merge-multiple: true
          path: double-damage
      - uses: actions/upload-artifact@v7
        with:
          name: double-damage
          path: double-damage/*.exe
          if-no-files-found: error
