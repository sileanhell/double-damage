[package]
name = "double-damage"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
futures-util = "0.3.34"
percent-encoding = "2.3.2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "rt"] }
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_System_SystemInformation"] }
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
