[package]
name = "dd-core"
version = "0.1.0"
description = "Double Damage core: model providers, their sign-ins, and a local Anthropic/OpenAI-compatible API"
edition = "2024"

[lib]
name = "dd_core"
path = "src/lib.rs"

[[bin]]
name = "dd-core"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
flate2 = "1.1.8"
futures-util = "0.3.34"
getrandom = "0.4.3"
percent-encoding = "2.3.2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["fs", "io-util", "io-std", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "1.2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
