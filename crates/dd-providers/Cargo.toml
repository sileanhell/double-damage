[package]
name = "dd-providers"
edition.workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
flate2 = "1"
futures-util = "0.3"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "sync", "time"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
